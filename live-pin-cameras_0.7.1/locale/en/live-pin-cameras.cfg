[mod-setting-description]
live-pin-cameras-limit=Includes hidden cameras. More visible cameras cost rendering time. Existing cameras are retained if you lower this limit.

[live-pin-cameras]
window-title=Live camera
preview-distance=Preview distance:
preview-distance-short=Zoom
window-width=Window width:
window-width-short=Size
camera-help=Ctrl+Shift+C creates a camera. Click i or Ctrl+Shift+L to manage cameras. Scroll zooms at the cursor. Empty-hand left click opens machines; distant targets enter native remote view for logistics-only access. Items/blueprints place ghosts. Empty-hand right click requests robot removal. Shift+right drag pans in small steps. Planners issue robot orders; Shift-click cancels. Ctrl-click two corners for area orders. X hides the camera.
out-of-reach=Camera: distant machines open in native remote view for logistics actions.
unsupported-tool=Camera: use a placeable item, cursor ghost, configured blueprint, or deconstruction planner. Other tools need the main remote view.
build-failed=Camera: this placement could not be completed. See factorio-current.log for details.
placement-blocked=Camera: nothing placed. Check terrain, obstructions, map visibility or existing ghosts.
reset-pan=Reset camera offset
manager-title=Live cameras
hide-camera=Hide camera (restore with Ctrl+Shift+L)
show-all=Show all
hide-all=Hide all
manager-close=Close list
show=Show
hide=Hide
delete=Delete
remote-view=Remote view
read-only=View only
limit-reached=Camera limit reached. Use Ctrl+Shift+L to manage cameras, or change the limit in Mod settings.
area-started=Area start set. Ctrl-click the opposite corner with the same planner. Add Shift on the second click to cancel orders. Change cursor tool or pan/zoom to cancel selection.
remote-failed=Cannot enter remote view from the current controller.
