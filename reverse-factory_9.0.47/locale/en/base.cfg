[mod-setting-description]
rf-solid-fluids=Enables fluid ingredients being recycled into solid fluids (which can be reprocessed back into fluids in a chemical plant).\nIf disabled, these fluid ingredients are simply deleted.
rf-allow-chemplant=Allows solid-fluid conversion recipes in Chemical Plants. If disabled, solid-fluids can only be converted through the automatic barreling machines.
rf-efficiency=Ignored unless Level of balance set to User-defined.\nEfficiency of Reverse Factory recipes. Default to 25%.
rf-intermediates=Ignored unless Level of balance set to User-defined.\nWhen enabled, recycling of intermediate products is gated to higher tiers of Reverse Factory only. When disabled, all items can be recycled at any tier.
rf-modules=Ignored unless Level of balance set to User-defined.\nReverse Factory only allows modules that alter consumption, speed, and pollution (Speed and Efficiency Modules).\nThis setting can additionally allow productivity (and quality if enabled).\nDefaults to none (or quality, if enabled)
rf-revert-modules=Ignored unless Level of balance set to User-defined.\nReverts the v9.0.5 nerf to max module slot count (back to 2,4,6).\nDefaults to false.
rf-craft-limit=Ignored unless Level of balance set to User-defined.\nRestricts which planets the Reverse Factory can be crafted from. Defaults to Nauvis only (forces the use of rockets to place on other planets from the list below)
rf-place-limit=Ignored unless Level of balance set to User-defined.\nRestricts which planets the Reverse Factory can be placed on. Defaults to Nauvis, Gleba, and Aquilo.
rf-autopush=UNTESTED for multiplayer, please disable if there are any desyncs. Pushes items to the output slot if input count does not match original crafting count. EX: 1 underground belt can not be recycled; pushed to output after a short delay (defined below)
rf-delay=How long to wait in between checks for the automatic ingredient push. Lower values run more often, but make the timer more accurate. Default to 30 (0.5 seconds).
rf-timer=How long to wait before pushing the stopped ingredients to the output slot. Default to 90 (1.5 seconds). Lower values will push the ingredients more quickly (less downtime, but more chance of accidentally pushed outputs).

[setting-description]
rf-balance=Vanilla = 25% Reverse Factory efficiency, recycling of intermediates gated to tier 3.\nNo balance = 100% Reverse Factory efficiency, recycling of intermediates enabled for all tiers.\nUser defined = whatever values are set by the user below.\nDefault to vanilla.
rf-balance-space-age=Vanilla = 25% Reverse Factory efficiency, recycling of intermediates gated to tier 3, only craftable on Nauvis, only placeable on Nauvis, Gleba, and Aquilo.\nNo balance = 100% Reverse Factory efficiency, recycling of intermediates enabled for all tiers, craftable and placeable everywhere.\nUser defined = whatever values are set by the user below.\nDefault to vanilla.